name: ARV Proof OSS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate public boundary
        run: npm run validate:public

      - name: Type-check reference implementation
        run: npm run typecheck

      - name: Run TypeScript tests
        run: npm test

  go:
    name: Go verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Run Go tests
        run: go test ./reference/go/...

      - name: Run Go vet
        run: go vet ./reference/go/...

